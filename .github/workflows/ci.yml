name: CI

# The cross-cutting rules live in the shared reusable workflow (micro-org/service-ci.yml): one
# database per service, no cross-service source imports, /livez + /readyz + /metrics, no env_file
# fan-out, no setInterval doing domain work, and a Postgres container that fails the build if the
# database suite skipped. Calling it is how this repository counts toward the measured target of
# zero bespoke CI files (docs/ecosystem/03 §5).
#
# What the reusable workflow cannot do here is added below:
#   - `migrate` exercises the migrator AS a migrator, on an empty database, exactly as a deploy runs
#     it — and proves it is idempotent, because a deploy re-runs it on every release.
#   - `rules` asserts, as text, the constraints and guards this service exists to add.
#
# There is no bespoke `image` job any more. The reusable workflow's image job passes the
# `runtimepkgs`/`contractspkgs` build contexts itself, gives the container a real migrated
# Postgres over host networking, and reads /livez — everything the bespoke job did, plus the
# database it never had (its smoke test pointed the container at 127.0.0.1:5432/ci, an address
# where nothing listened under bridge networking and a database that never existed).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: emberkin
      database-env-var: EMBERKIN_DATABASE_URL
      port: 4100
      # The image startup smoke test boots the real service, and `env.ts` validates its
      # configuration at import — so the container needs the variables it declares, not just a
      # database. URLs that are never dialled because /livez needs no upstream, and per-run key
      # material. Never a real credential.
      #
      # THE TWO LITERALS THAT USED TO SIT HERE ARE GONE, and neither could be kept (micro-org
      # #212). `OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000` is refused by
      # `assertGeneratedSecret`: it normalises to a string containing `cionly` and `notareal`, both
      # markers, and it is hyphenated prose rather than base64. `EMBERKIN_SERVICE_TOKEN=ci-only-
      # not-a-real-token-0000000000000` is refused for a different reason — `index.ts` presents
      # that value verbatim as a Bearer, so the slot takes a minted JWT and a typed string is not
      # one.
      #
      # NO GUARD WAS WEAKENED TO MAKE THIS PASS. CI does not need a WEAK secret, it needs A secret:
      # nothing in the smoke test verifies a signature or authenticates to anything, so both values
      # are generated per run by service-ci.yml and thrown away.
      #
      # `@token` NEEDS micro-org's service-ci.yml AT OR AFTER 15a32a3. If this job fails with
      # `EMBERKIN_SERVICE_TOKEN is not a minted service token`, the literal `@token` reached the
      # container unsubstituted, which means the called workflow predates that commit.
      #
      # AND RE-RUNNING WILL NOT FIX IT, which cost a red run to learn and is worth writing down: a
      # reusable workflow is resolved when the RUN IS CREATED, and `gh run rerun` replays that same
      # resolved version rather than re-reading `@main`. Only a new run — a fresh push — picks up a
      # change to the called workflow.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        LEDGER_URL=http://127.0.0.1:4007
        BILLING_URL=http://127.0.0.1:4009
        WORLDS_URL=http://127.0.0.1:4000
        EMBERKIN_SERVICE_TOKEN=@token
    secrets:
      # @cloudsforge/* resolves via link:../runtime, so the workflow checks out micro-runtime
      # and micro-contracts as siblings — both private, hence a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  migrate:
    name: The migrator, on an empty database
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        # Not a secret: this database lives for one job, is reachable only from it, and holds nothing.
        env:
          POSTGRES_USER: emberkin
          POSTGRES_PASSWORD: emberkin
          POSTGRES_DB: emberkin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U emberkin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMBERKIN_DATABASE_URL: postgres://emberkin:emberkin@127.0.0.1:5432/emberkin_test
      IDENTITY_JWKS_URL: http://127.0.0.1:4001/.well-known/jwks.json
      IDENTITY_ISSUER: http://127.0.0.1:4001
      LEDGER_URL: http://127.0.0.1:4007
      BILLING_URL: http://127.0.0.1:4009
      WORLDS_URL: http://127.0.0.1:4000
      # OUTBOX_SIGNING_SECRET and EMBERKIN_SERVICE_TOKEN are deliberately NOT here — see the first
      # step below.
    steps:
      # THE KEY MATERIAL IS GENERATED, not written into the mapping above.
      #
      # `@generate` and `@token` are features of service-ci.yml's `smoke-env` input and nothing
      # substitutes them in a bespoke job's `env:`, so a literal here would reach the migrator as
      # written — and the boot guard refuses both literals that used to sit there (micro-org #212).
      # `src/migrator.ts` imports `src/env.ts`, so this job validates them too and would exit 1
      # before touching the schema.
      #
      # Generated per run and thrown away. Masked before either is written, so a later step that
      # dumps its environment cannot put one in the log; nothing here ever prints them.
      - name: Real key material, for this run only
        run: |
          set -euo pipefail
          secret="$(openssl rand -base64 48)"
          echo "::add-mask::$secret"
          echo "OUTBOX_SIGNING_SECRET=$secret" >> "$GITHUB_ENV"
          # The JWT SHAPE this slot demands: two base64url segments and a dot. Unsigned, and
          # nothing in this job verifies it — the migrator dials no upstream at all.
          jwt_h=$(printf '{"alg":"EdDSA","typ":"JWT"}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          jwt_p=$(printf '{"sub":"ci","iss":"ci","exp":0}' | openssl base64 -A | tr '+/' '-_' | tr -d '=')
          jwt_s=$(openssl rand -base64 33 | tr '+/' '-_' | tr -d '=\n' | cut -c1-43)
          token="${jwt_h}.${jwt_p}.${jwt_s}"
          echo "::add-mask::$token"
          echo "EMBERKIN_SERVICE_TOKEN=$token" >> "$GITHUB_ENV"
      # Temporary: the three checkouts exist only because the runtime and contracts packages are
      # unpublished. On publish this collapses to one checkout.
      - uses: actions/checkout@v4
        with: { path: emberkin }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-runtime, path: runtime, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: actions/checkout@v4
        with: { repository: cloudsforge-online/micro-contracts, path: contracts, token: "${{ secrets.ESTATE_READ_TOKEN }}" }
      - uses: pnpm/action-setup@v4
        with: { version: 11.9.0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: emberkin/pnpm-lock.yaml
      # `link:` resolves to the sibling's own node_modules, so the siblings must be installed
      # before this repository is — without this, `node --import tsx src/migrator.ts` cannot load
      # the runtime source's own imports (@opentelemetry/api, jose) and dies at the first one.
      - name: Install the sibling runtime and contracts
        run: |
          set -euo pipefail
          pnpm --dir runtime install --frozen-lockfile
          pnpm --dir contracts install --frozen-lockfile
      - name: Install
        working-directory: emberkin
        run: pnpm install --frozen-lockfile
      - name: Migrate the test database
        working-directory: emberkin
        run: pnpm migrate
      - name: Migrating twice is a no-op
        working-directory: emberkin
        # A deploy re-runs the one-shot job on every release; a migrator that is not idempotent turns
        # the second deploy of an unchanged schema into an outage.
        run: pnpm migrate

  rules:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Asserted as text so a refactor cannot delete them without a red build. The tests prove they
      # WORK; these prove they are still THERE.
      - name: The save, battle and budget constraints still exist
        run: |
          grep -q 'saves_seed_range' src/migrations.ts \
            || { echo '::error::the seed-range constraint is gone; a seed could exceed the C# RNG domain'; exit 1; }
          grep -q 'battles_key_uniq' src/migrations.ts \
            || { echo '::error::the battle idempotency key is no longer unique; a retry could resolve twice'; exit 1; }
          grep -q 'seasons_within_budget' src/migrations.ts \
            || { echo '::error::the season budget cap is gone; a reward exploit becomes unbounded'; exit 1; }

      - name: This service holds no money
        # There is no balance column anywhere: a cosmetic purchase is a billing entitlement plus a
        # ledger posting, and a season reward is a ledger posting. A balance column is the first step
        # of a second ledger.
        run: |
          if grep -nE '^\s+(balance|shards|held_amount|available)\s' src/migrations.ts; then
            echo '::error::a balance column appeared in the schema; the ledger owns balances'
            exit 1
          fi
          echo 'ok: no balance column'

      - name: The inbound event webhook still verifies a signature
        # This used to grep src/server.ts for 'timingSafeEqual', and that proxy went stale the
        # moment the signature scheme moved to @cloudsforge/contracts-events: the timing-safe
        # comparison now lives in the contract's verifyDelivery, which is exactly where it should
        # live and precisely what the old grep read as "the check is gone". A guard that fails on
        # the correct fix teaches people to delete the guard, so it now asserts the PROPERTY —
        # the route verifies before it parses, and refuses — rather than one file's spelling.
        run: |
          grep -q 'verifyInbound(' src/server.ts \
            || { echo '::error::the event signature check is gone; POST /v1/events is a reward-anyone endpoint'; exit 1; }
          # Verified over the RAW BYTES, before JSON.parse: parsing first hands the parser to an
          # unauthenticated caller. The verify call must come before the first parse in the file.
          verify_at=$(grep -n 'verifyInbound(' src/server.ts | head -1 | cut -d: -f1)
          parse_at=$(grep -n 'JSON.parse(raw' src/server.ts | head -1 | cut -d: -f1)
          if [ -z "$parse_at" ] || [ "$verify_at" -ge "$parse_at" ]; then
            echo '::error::the signature is no longer checked BEFORE the body is parsed'
            exit 1
          fi
          # And a failed check still refuses. 403, not 401: the MAC is the credential.
          grep -q "403, 'bad_signature'" src/server.ts \
            || { echo '::error::a bad event signature no longer answers 403'; exit 1; }
          # The scheme itself is the contract's, imported rather than copied. A local sha256=<hmac>
          # in the signing path is the drift that made every delivery to this service 403 for the
          # whole of its life; the one permitted mention is the documented legacy inbound arm.
          grep -q "from '@cloudsforge/contracts-events'" src/outbox.ts \
            || { echo '::error::the event signing scheme is no longer the contract'"'"'s; it has drifted again'; exit 1; }
          echo 'ok: inbound events are verified against the contract scheme before parsing'

      - name: A battle submission still requires an idempotency key
        run: |
          grep -q 'idempotency-key' src/server.ts \
            || { echo '::error::a battle submission no longer requires an Idempotency-Key; a retry re-applies'; exit 1; }

  hygiene:
    uses: cloudsforge-online/micro-org/.github/workflows/secret-hygiene.yml@main
    permissions:
      contents: read

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, migrate, rules, hygiene]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
